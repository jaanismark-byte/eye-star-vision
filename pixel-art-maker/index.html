<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art Maker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.22);
    --text: #1a1a1a;
    --text-muted: #666;
    --radius: 10px;
    --radius-sm: 6px;
    --accent: #3a3af4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181a;
      --surface: #252528;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.22);
      --text: #f0f0f0;
      --text-muted: #888;
      --accent: #7c7cf8;
    }
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    gap: 1.5rem;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    width: 100%;
    max-width: 560px;
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  label {
    font-size: 13px;
    color: var(--text-muted);
    min-width: 70px;
    flex-shrink: 0;
  }

  .pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pill {
    padding: 5px 12px;
    font-size: 13px;
    border: 0.5px solid var(--border-strong);
    border-radius: 99px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
    font-family: inherit;
  }

  .pill:hover { background: var(--bg); }

  .pill.active {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
  }

  .palette-swatch {
    display: flex;
    gap: 3px;
    align-items: center;
    padding: 5px 8px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: transparent;
    cursor: pointer;
    transition: border-color 0.1s, background 0.1s;
  }

  .palette-swatch:hover { background: var(--bg); }

  .palette-swatch.active {
    border-color: var(--accent);
    border-width: 1.5px;
    background: var(--bg);
  }

  .swatch-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .canvas-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
    background: repeating-conic-gradient(var(--border) 0% 25%, transparent 0% 50%) 0 0 / 16px 16px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    margin: 1rem 0;
  }

  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius: 3px;
    display: block;
  }

  .actions {
    display: flex;
    gap: 8px;
  }

  button.primary {
    flex: 1;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    background: var(--text);
    color: var(--surface);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.1s;
  }

  button.primary:hover { opacity: 0.82; }
  button.primary:active { opacity: 0.65; }

  button.secondary {
    padding: 10px 18px;
    font-size: 14px;
    background: transparent;
    color: var(--text);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.1s;
  }

  button.secondary:hover { background: var(--bg); }

  .seed-display {
    font-size: 11px;
    color: var(--text-muted);
    font-family: monospace;
    text-align: center;
    margin-top: 4px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  input[type=range] {
    flex: 1;
    accent-color: var(--accent);
  }

  .slider-val {
    font-size: 13px;
    min-width: 28px;
    text-align: right;
    color: var(--text-muted);
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .divider {
    border: none;
    border-top: 0.5px solid var(--border);
  }
</style>
</head>
<body>

<h1>Pixel Art Maker</h1>

<div class="card controls">

  <!-- Grid size -->
  <div>
    <div class="section-label">Grid size</div>
    <div class="pills" id="size-pills">
      <button class="pill" data-size="8">8 × 8</button>
      <button class="pill active" data-size="12">12 × 12</button>
      <button class="pill" data-size="16">16 × 16</button>
      <button class="pill" data-size="24">24 × 24</button>
    </div>
  </div>

  <hr class="divider">

  <!-- Symmetry -->
  <div>
    <div class="section-label">Symmetry</div>
    <div class="pills" id="sym-pills">
      <button class="pill active" data-sym="vertical">Left–right</button>
      <button class="pill" data-sym="both">4-way</button>
      <button class="pill" data-sym="none">None</button>
    </div>
  </div>

  <hr class="divider">

  <!-- Fill density -->
  <div>
    <div class="section-label">Fill density</div>
    <div class="slider-row">
      <input type="range" id="density" min="20" max="80" value="50" step="1">
      <span class="slider-val" id="density-val">50%</span>
    </div>
  </div>

  <hr class="divider">

  <!-- Palettes -->
  <div>
    <div class="section-label">Palette</div>
    <div class="pills" id="palette-pills" style="gap:8px"></div>
  </div>

</div>

<!-- Canvas -->
<div class="card" style="max-width:560px">
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
  <div class="actions">
    <button class="primary" id="btn-generate">Generate new</button>
    <button class="secondary" id="btn-export">Export PNG</button>
  </div>
  <div class="seed-display" id="seed-display"></div>
</div>

<script>
const PALETTES = [
  { name: "Retro",    colors: ["#e63946","#f4a261","#2a9d8f","#264653","#e9c46a"] },
  { name: "Gameboy",  colors: ["#0f380f","#306230","#8bac0f","#9bbc0f","#c4d94a"] },
  { name: "Neon",     colors: ["#ff006e","#8338ec","#3a86ff","#06d6a0","#ffbe0b"] },
  { name: "Pastel",   colors: ["#ffadad","#ffd6a5","#fdffb6","#caffbf","#9bf6ff","#bdb2ff"] },
  { name: "Ocean",    colors: ["#03045e","#0077b6","#00b4d8","#90e0ef","#caf0f8"] },
  { name: "Mono",     colors: ["#f8f9fa","#adb5bd","#6c757d","#343a40","#212529"] },
];

let state = {
  gridSize: 12,
  symmetry: "vertical",
  density: 50,
  palette: 0,
  seed: 0,
};

let rng;

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function generate() {
  state.seed = Math.floor(Math.random() * 0xffffffff);
  draw();
}

function draw() {
  rng = mulberry32(state.seed);
  const { gridSize, symmetry, density, palette } = state;
  const colors = PALETTES[palette].colors;
  const cellPx = Math.floor(288 / gridSize);
  const size = cellPx * gridSize;

  const canvas = document.getElementById("canvas");
  canvas.width = size;
  canvas.height = size;
  canvas.style.width = size + "px";
  canvas.style.height = size + "px";
  const ctx = canvas.getContext("2d");

  const halfW = Math.ceil(gridSize / 2);
  const halfH = Math.ceil(gridSize / 2);
  const grid = [];
  for (let y = 0; y < gridSize; y++) {
    grid[y] = [];
    for (let x = 0; x < gridSize; x++) {
      let srcX = x, srcY = y;
      if (symmetry === "vertical" || symmetry === "both") {
        srcX = x < halfW ? x : gridSize - 1 - x;
      }
      if (symmetry === "both") {
        srcY = y < halfH ? y : gridSize - 1 - y;
      }

      if (!grid[srcY] || grid[srcY][srcX] === undefined) {
        const filled = rng() * 100 < density;
        const colorIdx = filled ? Math.floor(rng() * colors.length) : null;
        if (!grid[srcY]) grid[srcY] = [];
        grid[srcY][srcX] = colorIdx;
      }

      grid[y][x] = grid[srcY][srcX];
    }
  }

  ctx.clearRect(0, 0, size, size);
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      const ci = grid[y][x];
      if (ci !== null) {
        ctx.fillStyle = colors[ci];
        ctx.fillRect(x * cellPx, y * cellPx, cellPx, cellPx);
      }
    }
  }

  document.getElementById("seed-display").textContent = "seed: " + state.seed.toString(16).padStart(8, "0");
}

function buildPalettePills() {
  const container = document.getElementById("palette-pills");
  container.innerHTML = "";
  PALETTES.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.className = "palette-swatch" + (i === state.palette ? " active" : "");
    btn.title = p.name;
    p.colors.slice(0, 5).forEach(c => {
      const dot = document.createElement("div");
      dot.className = "swatch-dot";
      dot.style.background = c;
      btn.appendChild(dot);
    });
    const lbl = document.createElement("span");
    lbl.style.cssText = "font-size:12px;margin-left:4px;color:var(--text-muted)";
    lbl.textContent = p.name;
    btn.appendChild(lbl);
    btn.addEventListener("click", () => {
      state.palette = i;
      document.querySelectorAll(".palette-swatch").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      draw();
    });
    container.appendChild(btn);
  });
}

document.querySelectorAll("#size-pills .pill").forEach(btn => {
  btn.addEventListener("click", () => {
    state.gridSize = parseInt(btn.dataset.size);
    document.querySelectorAll("#size-pills .pill").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    draw();
  });
});

document.querySelectorAll("#sym-pills .pill").forEach(btn => {
  btn.addEventListener("click", () => {
    state.symmetry = btn.dataset.sym;
    document.querySelectorAll("#sym-pills .pill").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    draw();
  });
});

const densityInput = document.getElementById("density");
densityInput.addEventListener("input", () => {
  state.density = parseInt(densityInput.value);
  document.getElementById("density-val").textContent = state.density + "%";
  draw();
});

document.getElementById("btn-generate").addEventListener("click", generate);

document.getElementById("btn-export").addEventListener("click", () => {
  const canvas = document.getElementById("canvas");
  const scale = 8;
  const out = document.createElement("canvas");
  out.width = canvas.width * scale;
  out.height = canvas.height * scale;
  const ctx = out.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(canvas, 0, 0, out.width, out.height);
  const a = document.createElement("a");
  a.href = out.toDataURL("image/png");
  a.download = "sprite-" + state.seed.toString(16) + ".png";
  a.click();
});

buildPalettePills();
generate();
</script>
</body>
</html>
